
logLevel: info

rtsp: yes
rtspAddress: ":8554"

api: yes
apiAddress: ":9997"

hls: no

authMethod: internal

authInternalUsers:
  # Go backend service account
  - user: video_backend
    pass: "pass123"
    ips: []
    permissions:
      - action: api

  # Allow RTSP publishing and reading
  # Development-only access policy
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback

paths:
  all_others:
    source: publisher
