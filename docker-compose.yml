
services:
  postgres:
    image: postgres:16
    container_name: video-platform-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: video_app
      POSTGRES_PASSWORD: pass@4588
      POSTGRES_DB: video_platform
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U video_app -d video_platform
      interval: 5s
      timeout: 5s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: mediamtx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:9997:9997"

    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

volumes:
  postgres_data:
